# Alembic config. Run from proj_2/:
#   alembic -c db/alembic.ini upgrade head                         apply migrations
#   alembic -c db/alembic.ini revision --autogenerate -m "..."     new migration from models.py
# The database URL comes from DATABASE_URL (see db/session.py), not from this file.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..
# Split paths on os.pathsep, not spaces: checkouts can live under paths with spaces.
path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
