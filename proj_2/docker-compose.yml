services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-packplate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-packplate}
      POSTGRES_DB: ${POSTGRES_DB:-packplate}
    ports:
      # Host port; set POSTGRES_PORT in .env if 5432 is taken (e.g. a local Postgres).
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-packplate}:${POSTGRES_PASSWORD:-packplate}@db:5432/${POSTGRES_DB:-packplate}
      FRONTEND_ORIGIN: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
